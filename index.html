<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Spellplane: a trading card game table for friends, peer-to-peer in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%23111' transform='rotate(-8 16 16)'/%3E%3C/svg%3E" />
    <title>Spellplane</title>
    <style>
      /* iPad Safari (PLAN Milestone 5, owner decisions): no double-tap zoom (manipulation keeps pan and pinch for pages
         that scroll), no pull-to-refresh or rubber-band bounce of the page, no font inflation, no grey tap flash. The
         table's canvas, hand fan and radial menu take every touch themselves (touch-action: none). */
      html {
        touch-action: manipulation;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
