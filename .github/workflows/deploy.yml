name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # GitHub Pages needs a public repository on the current plan; while the repo is
    # private the deploy is skipped (owner check in docs/gates/SUMMARY.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp dist/index.html dist/404.html
      # M7 fast feedback: the `preview` branch, when it exists, is built beside the live site at /spellplane/preview/
      # (its own saved data, no service worker, a Preview label). Pushes to `preview` dispatch this workflow on main.
      - name: Check out the preview branch
        id: pv
        run: |
          if git ls-remote --exit-code --heads origin preview >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pv.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: preview
          path: pv
      - if: steps.pv.outputs.exists == 'true'
        name: Build the preview
        working-directory: pv
        env:
          SPELLPLANE_BASE: /spellplane/preview/
          SPELLPLANE_PREVIEW: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../dist/preview
          cp -R dist/. ../dist/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
